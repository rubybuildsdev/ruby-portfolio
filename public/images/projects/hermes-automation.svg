<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hermesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#229ED9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#hermesBg)"/>
  
  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="40" rx="12" fill="#111827"/>
  <circle cx="65" cy="50" r="5" fill="#ef4444"/>
  <circle cx="85" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="105" cy="50" r="5" fill="#10b981"/>
  <text x="400" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">Hermes Agent Hub // Telegram Gateway + MCP Cluster</text>

  <!-- Telegram Chat Node -->
  <rect x="70" y="100" width="190" height="110" rx="10" fill="#152438" stroke="#229ED9" stroke-width="2"/>
  <rect x="85" y="115" width="80" height="20" rx="4" fill="#229ED9" fill-opacity="0.2"/>
  <text x="125" y="129" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">TELEGRAM UI</text>
  <text x="85" y="155" font-family="monospace" font-size="12" fill="#f8fafc">User Voice / Text</text>
  <text x="85" y="178" font-family="monospace" font-size="10" fill="#94a3b8">&gt; Auto-Scheduled Task</text>
  <text x="85" y="195" font-family="monospace" font-size="10" fill="#10b981">Status: Listening...</text>

  <!-- Connectors -->
  <path d="M 260 155 H 330" stroke="url(#tgGrad)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Hermes Agent Core -->
  <rect x="330" y="90" width="190" height="130" rx="10" fill="#0c1e28" stroke="#10b981" stroke-width="2"/>
  <text x="425" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">HERMES AGENT</text>
  <text x="425" y="145" text-anchor="middle" font-family="monospace" font-size="10" fill="#67e8f9">Orchestration Loop</text>
  <rect x="350" y="160" width="150" height="45" rx="6" fill="#020617" stroke="#1f2937" stroke-width="1"/>
  <text x="425" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Gateway: 9Router</text>
  <text x="425" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">MCP Protocol Active</text>

  <!-- Split Connectors to integrations -->
  <path d="M 520 135 H 565 V 110 H 590" stroke="#10b981" stroke-width="2"/>
  <path d="M 520 175 H 565 V 205 H 590" stroke="#06b6d4" stroke-width="2"/>

  <!-- Buffer MCP Node -->
  <rect x="590" y="80" width="140" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="660" y="105" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#60a5fa">BUFFER MCP</text>
  <text x="660" y="125" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Auto Content Post</text>

  <!-- Scheduled Reminders Node -->
  <rect x="590" y="175" width="140" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="660" y="200" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">CRON WORKERS</text>
  <text x="660" y="220" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Reminders &amp; Daily Triage</text>

  <!-- Terminal Live Log Output -->
  <rect x="70" y="255" width="660" height="140" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
  <text x="90" y="280" font-family="monospace" font-size="11" fill="#38bdf8">&gt; [HERMES] Syncing with 9Router local model gateway... OK</text>
  <text x="90" y="305" font-family="monospace" font-size="11" fill="#10b981">&gt; [MCP_BUFFER] Connected via Model Context Protocol stdio pipe</text>
  <text x="90" y="330" font-family="monospace" font-size="11" fill="#f59e0b">&gt; [TELEGRAM] Webhook live: received trigger /schedule_social_post</text>
  <text x="90" y="355" font-family="monospace" font-size="11" fill="#a7f3d0">&gt; [SUCCESS] Post payload synthesized &amp; dispatched to queue</text>
</svg>
